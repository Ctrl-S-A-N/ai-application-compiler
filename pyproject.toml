[project]
name = "ai-application-compiler"
version = "0.1.0"
description = "A deterministic compiler pipeline from natural language requirements to validated runnable application scaffolds."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx2>=0.28.0",
]
structured-output = [
    "instructor>=1.4.0",
    "pydantic-ai>=0.0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=compiler --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app", "compiler"]

[tool.coverage.report]
show_missing = true
skip_covered = false
